# ЛОКАЛЬНАЯ разработка (подхватывается автоматически). На сервере не используется.
services:
  sync:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      ENVIRONMENT: development
      ENABLE_DOCS: "true"
    volumes:
      - .:/app
    ports:
      - "8001:8001"
